server:
  port: 7075
  servlet:
    context-path: /compass
    session:
      cookie:
        http-only: true
        secure: true
      timeout: 86400

spring:
  messages:
    encoding: UTF-8
    basename: i18n/messages
  application:
    name: task-portal
  profiles:
    active:
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  main:
    allow-circular-references: true
  datasource:
    url: jdbc:mysql://localhost:3306/compass?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username:
    password:
    druid:
      initial-size: 5
      min-idle: 10
      max-active: 20
  opensearch:
    nodes: localhost:9200
    username:
    password:
    truststore:
    truststore-password:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  jackson: # serialize & deserialize time zone.
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations:
    - classpath:dao/*.xml
    - classpath*:com/**/mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

custom:
  opensearch:
    logIndex:
      name: "compass-log-summary"
      shards: 10
      replicas: 2
    appIndex:
      name: "compass-task-app"
      shards: 10
      replicas: 2
    jobIndex:
      name: "compass-job-analysis"
      shards: 10
      replicas: 2
    detectIndex:
      name: "compass-detector-app"
    gcIndex:
      name: "compass-gc-log"
    yarnIndex:
      name: "compass-yarn-app"
    sparkIndex:
      name: "compass-spark-app"
    jobInstanceIndex:
      name: "compass-job-instance"
      shards: 10
      replicas: 2
  redis:
    logRecordKey: "{lua}:log:record"

  jwt:
    expireDay: ${JWT_EXPIRE_DAYS:15}
    # JWT secret MUST be set via environment variable JWT_SECRET (min 32 chars).
    # Never hardcode secrets in configuration files.
    secret: ${JWT_SECRET}

spark:
  io:
    compression:
      codec: ""


