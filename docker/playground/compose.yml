  dolphinscheduler:
    build:
      context: ./
      dockerfile: dockerfiles/compass-playground-dolphinscheduler.Dockerfile
      args:
        TZ: Asia/Shanghai
        MYSQL_USERNAME: root
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: dolphinscheduler
        HADOOP_VERSION: ${HADOOP_VERSION}
        SPARK_VERSION: ${SPARK_VERSION}
