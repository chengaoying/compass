server:
  port: 7071

spring:
  application:
    name: task-analyzer
  profiles:
    active: hadoop
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/compass?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    druid:
      initial-size: 5
      min-idle: 10
      max-active: 20
  # Redis: single node (no cluster). Used only for task-detect's delayed queue.
  # RedisConsumer (parser) is disabled; parsing is now done in-process via AnalyzerBridge.
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 8
        max-idle: 4
        min-idle: 1
  opensearch:
    nodes: ${OPENSEARCH_NODES:localhost:9200}
    username: ${OPENSEARCH_USERNAME:}
    password: ${OPENSEARCH_PASSWORD:}
    truststore:
    truststore-password:
    # OpenSearch index prefixes (from task-parser)
    log-prefix: "compass-log-summary-"
    detector-prefix: "compass-detector-app-"
    gc-prefix: "compass-gc-log-"
    job-prefix: "compass-job-analysis-"
    task-app-prefix: "compass-task-app-"
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      type: batch
      ack-mode: MANUAL_IMMEDIATE
    consumer:
      enable-auto-commit: false
      max-poll-records: 50   # increased from 1 for throughput
    # topic for publishing parsed log results
    topic: "task-analysis-result"

mybatis:
  mapper-locations:
    - classpath:dao/*.xml
    - classpath*:com/**/mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

custom:
  schedulerType: ${SCHEDULER:dolphinscheduler}

  # Detect settings (from task-detect)
  kafka:
    consumer:
      group-id: cp-analyzer-task
      topic-name: task-instance
      auto:
        start: true

  detect:
    threadPoolSize: 10
  detectionRule:
    durationWarning: 2       # hours
    alwaysFailedWarning: 10  # days

  # Delayed task queue for retrying tasks with pending applicationIds
  delayedTaskQueue:
    enable: true
    delayedSeconds: 10
    tryTimes: 5
  redis:
    delayedQueue: "{lua}:delayed:task"
    processing: "{lua}:detected:processing"

  # Parser settings (from task-parser)
  parser:
    maxConcurrentParsers: 10

  # RedisConsumer DISABLED: parsing is now done in-process via AnalyzerBridge.
  # Setting enable=false prevents RedisConsumer from starting.
  redisConsumer:
    enable: false

  opensearch:
    yarn-app-index: "compass-yarn-app"
    spark-app-index: "compass-spark-app"
    job-index: "compass-job-analysis"
    app-index: "compass-task-app"
    job-instance-index: "compass-job-instance"

  jvmType:
    - Java HotSpot
    - OpenJDK

  # Detector thresholds (from task-parser)
  detector:
    sparkEnvironmentConfig:
      jvmInformation:
        - Java Version
      sparkProperties:
        - spark.driver.memoryOverhead
        - spark.driver.memory
        - spark.executor.memoryOverhead
        - spark.executor.memory
        - spark.executor.cores
        - spark.dynamicAllocation.maxExecutors
        - spark.default.parallelism
        - spark.sql.shuffle.partitions
      systemProperties:
        - sun.java.command
    speculativeTaskConfig:
      disable: false
      threshold: 20
      duration: 300000
    memWasteConfig:
      disable: false
      threshold: 70
      duration: 300000
    cpuWasteConfig:
      disable: false
      duration: 300000
      driverThreshold: 50
      executorThreshold: 50
    jobDurationConfig:
      disable: false
      threshold: 30
      duration: 300000
    stageDurationConfig:
      disable: false
      threshold: 30
      duration: 300000
    taskDurationConfig:
      disable: false
      threshold: 10
      duration: 300000
    hdfsStuckConfig:
      disable: false
      threshold: 10
      taskSize: 10
      duration: 300000
    globalSortConfig:
      disable: false
      taskCount: 1
      records: 50000000
      duration: 1200000
    largeTableScanConfig:
      disable: false
      scanTable: 50000000000
      duration: 1200000
    oomWarnConfig:
      disable: false
      oom: 40
      duration: 1200000
      broadcastRows: 5000000
      broadcastRowsOom: 30
    dataSkewConfig:
      disable: false
      duration: 1200000
      stageDurationPercentage: 20
      interval:
        - {start: 0, end: 50000, threshold: 0}
        - {start: 50000, end: 100000, threshold: 100}
        - {start: 100000, end: 1000000, threshold: 50}
        - {start: 1000000, end: 5000000, threshold: 10}
        - {start: 5000000, end: 20000000, threshold: 5}
        - {start: 20000000, end: 30000000, threshold: 3.5}
        - {start: 30000000, end: 40000000, threshold: 3}
        - {start: 40000000, end: 50000000, threshold: 2.25}
        - {start: 50000000, end: 0, threshold: 2}

spark:
  io:
    compression:
      codec: ""
