server:
  port: 7072

spring:
  profiles:
    active: hadoop
  task:
    scheduling:
      pool:
        size: 10
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

  opensearch:
    nodes: localhost:19527
    username:
    password:
    truststore:
    truststore-password:
    yarn-app-prefix: "compass-yarn-app-"
    spark-app-prefix: "compass-spark-app-"

scheduler:
  clusterMeta:
    enable: true
    cron: "0 */30 * * * ?"
  yarnMeta:
    enable: true
    cron: "0/30 * * * * ?"
    # hour
    startedTimeBegin: 6
  sparkMeta:
    enable: true
    cron: "0/30 * * * * ?"
    limitCount: 1000
